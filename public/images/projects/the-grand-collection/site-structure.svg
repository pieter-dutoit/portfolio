<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 322.18px; background-color: rgb(248, 250, 252);" viewBox="-4 4 322.1796875 222.20001220703125" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">The Grand Collection site and URL hierarchy</title><desc id="chart-desc-my-svg">The Grand Collection branches into guesthouses and destinations. Guesthouse pages contain property posts under articles, while destination pages contain local guides under guides. Solid lines show this hierarchy. A dotted line shows links in both directions between guesthouse pages and destination guides. Ellipses represent individual page slugs and the preceding parent path.</desc><style>#my-svg{font-family:Arial,sans-serif;font-size:14px;fill:#1e293b;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(180, 0%, 100%);}#my-svg .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#475569;stroke:#475569;}#my-svg .marker.cross{stroke:#475569;}#my-svg svg{font-family:Arial,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .label{font-family:Arial,sans-serif;color:#1e293b;}#my-svg .cluster-label text{fill:rgb(0, 0,