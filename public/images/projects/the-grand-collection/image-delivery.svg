<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 235.312px; background-color: rgb(248, 250, 252);" viewBox="-4 -12 235.3125 434.1999816894531" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">Image processing and cached delivery</title><desc id="chart-desc-my-svg">On upload, the CMS resizes the image, converts it to WebP variants and stores them in Cloudflare R2. When viewed, Cloudflare serves the selected image to the browser from its CDN cache, fetching from R2 only on a cache miss.</desc><style>#my-svg{font-family:Arial,sans-serif;font-size:14px;fill:#1e293b;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(180, 0%, 100%);}#my-svg .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#475569;stroke:#475569;}#my-svg .marker.cross{stroke:#475569;}#my-svg svg{font-family:Arial,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .label{font-family:Arial,sans-serif;color:#1e293b;}#my-svg .cluster-label text{fill:rgb(0, 0, 0);}#my-svg .cluster-label span{color:rgb(0, 0, 0);}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#1e293b;col